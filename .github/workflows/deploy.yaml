name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "ai/**"
      - "setup/*"
      - "wsgi.py"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        with:
          host: ${{ secrets.ORACLE_CLOUD_VM_PUBLIC_IP }}
          username: ${{ secrets.ORACLE_CLOUD_VM_USERNAME }}
          password: ${{ secrets.ORACLE_CLOUD_VM_SSH_PASSWORD }}
          port: ${{ secrets.ORACLE_CLOUD_VM_SSH_PORT }}
          envs: LLM_API_KEY
          command_timeout: 15m
          script: |
            set -e

            REPO_DIR="/home/ubuntu/Backend"
            REPO_URL="https://github.com/KNU-DB-HRIS/Backend.git"

            if [ -d "$REPO_DIR/.git" ]; then
              echo "Repository exists. Updating..."
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard origin/main
            elif [ ! -e "$REPO_DIR" ]; then
              echo "Repository not found. Cloning..."
              git clone --branch main "$REPO_URL" "$REPO_DIR"
              cd "$REPO_DIR"
            else
              echo "ERROR: Repository path exists but is not a Git repository."
              exit 1
            fi

            test -f .env

            chmod +x ./setup/*.sh

            if [ -n "${LLM_API_KEY:-}" ]; then
              ./setup/llm-env.sh || echo "HR AI: LLM settings NOT applied, deploy continues"
            else
              echo "HR AI: LLM_API_KEY secret not set, LLM settings unchanged"
            fi

            docker compose config --quiet
            docker compose build backend ai
            docker compose up -d

            ./setup/database.sh

            if grep -Eq '^AI_DATABASE_URL=mysql' .env; then
              ./setup/ai.sh
            else
              echo "HR AI: AI_DATABASE_URL not set, skipped"
            fi

            ai_port="$(sed -n 's/^AI_PORT=//p' .env | tail -1)"
            echo "HR AI health: $(curl -fsS --max-time 5 "http://127.0.0.1:${ai_port:-8001}/health" 2>&1 || true)"

            docker compose ps