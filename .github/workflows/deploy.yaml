name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "ai/**"
      - "setup/*"
      - "wsgi.py"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_CLOUD_VM_PUBLIC_IP }}
          username: ${{ secrets.ORACLE_CLOUD_VM_USERNAME }}
          password: ${{ secrets.ORACLE_CLOUD_VM_SSH_PASSWORD }}
          port: ${{ secrets.ORACLE_CLOUD_VM_SSH_PORT }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/Backend
            git fetch origin main
            git reset --hard origin/main
            test -f .env
            chmod +x ./setup/*
            docker compose config --quiet
            docker compose build backend ai
            docker compose up -d
            ./setup/database.sh
            # HR AI 읽기 전용 계정: 서버 .env에 AI_DATABASE_URL이 있을 때만 (없으면 AI만 비활성, 배포는 계속)
            if grep -Eq '^AI_DATABASE_URL=mysql' .env; then ./setup/ai.sh; else echo "HR AI: AI_DATABASE_URL not set, skipped"; fi
            docker compose ps