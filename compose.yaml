
x-app: &app
  build: .
  environment:
    APP_ENV: ${APP_ENV:-development}
    DB_HOST: mysql
    DB_NAME: ${MYSQL_DATABASE:-hris}
    DB_USER: ${MYSQL_USER:-hris_app}
    DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    STORAGE_DIR: /app/instance/files
    AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
    AI_DATABASE_URL: ${AI_DATABASE_URL:-}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-7200}

services:
  backend:
    <<: *app
    ports:
      - "${BACKEND_PORT:-8080}:5000"
    volumes:
      - file_data:/app/instance/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 배포 직후 빌드·마이그레이션이 겹치면(1GB 서버, 스왑 사용) 첫 응답이 2분 넘게 걸림. 그동안의 실패는 unhealthy로 세지 않음
      start_period: 180s
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["flask", "--app", "wsgi:app", "db-upgrade", "--base-dir", "/database"]
    volumes:
      - ./database:/database:ro
    depends_on:
      mysql:
        condition: service_healthy

  ai:
    # NL2SQL(FastAPI): 질문 → SQL 생성만. DB 접속 없음, LLM 키는 이 컨테이너에만 들어감
    build: ./ai
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-12}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-0}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      NL2SQL_PROMPT_MODE: ${NL2SQL_PROMPT_MODE:-enhanced}
      LLM_FIXTURE_FILE: ${LLM_FIXTURE_FILE:-}
    ports:
      - "127.0.0.1:${AI_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 로컬 Ollama 쓸 때 (Linux 대비)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hris}
      MYSQL_USER: ${MYSQL_USER:-hris_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  mysql_data:
  file_data: