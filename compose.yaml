x-application: &application
  build: .
  environment:
    APP_ENV: ${APP_ENV:-development}
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_NAME: ${MYSQL_DATABASE:-hris}
    DB_USER: ${MYSQL_USER:-hris_app}
    DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    STORAGE_DIR: /app/instance/files
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_DATABASE_URL: ${AI_DATABASE_URL:-}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-7200}

services:
  backend:
    <<: *application
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:5000"
    volumes:
      - file_data:/app/instance/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *application
    command: ["flask", "--app", "wsgi:app", "db-upgrade", "--base-dir", "/database"]
    volumes:
      - type: bind
        source: ${DATABASE_SQL_DIR:-./database}
        target: /database
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hris}
      MYSQL_USER: ${MYSQL_USER:-hris_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP
          -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE"
          -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  mysql_data:
  file_data:
